name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level high

      - name: Secret and license policy
        run: pnpm security:check

  migrations:
    name: PostgreSQL migration up/down
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: libai
          POSTGRES_PASSWORD: libai
          POSTGRES_DB: libai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U libai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: libai
    steps:
      - uses: actions/checkout@v6
      - name: Apply and revert migration
        run: |
          psql -h 127.0.0.1 -U libai -d libai -v ON_ERROR_STOP=1 -f packages/application/migrations/0001_recommendations.up.sql
          psql -h 127.0.0.1 -U libai -d libai -v ON_ERROR_STOP=1 -f packages/application/migrations/0001_recommendations.down.sql
